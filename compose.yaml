name: lumo
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: lumo_local
      POSTGRES_DB: lumo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumo -d lumo"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
